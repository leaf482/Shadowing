name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Start server and auth smoke tests
        run: |
          set -euo pipefail
          export SQLITE_PATH="${RUNNER_TEMP}/shadowing-ci.db"
          export NODE_ENV=production
          export CI=true
          export PORT=3000
          rm -f "$SQLITE_PATH"
          node --import ./instrument.mjs server/index.js &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/clinics" >/dev/null; then
              READY=1
              break
            fi
            sleep 1
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server process exited unexpectedly"
              exit 1
            fi
          done
          test "${READY:-0}" = "1" || { echo "Server did not become ready"; exit 1; }
          npm run test:smoke:auth
