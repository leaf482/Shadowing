AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Shadow Network API — HTTP API + Lambda + DynamoDB (pay-per-request)

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: nodejs24.x
    Architectures:
      - arm64

Parameters:
  Stage:
    Type: String
    Default: dev
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated admin emails for ADMIN_EMAILS (optional).

Resources:
  ClinicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AuthSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ShadowingRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ExperiencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlacementSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: project_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProjectIdIndex
          KeySchema:
            - AttributeName: project_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  QualityFlagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: lambda-handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShadowingRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExperiencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlacementSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QualityFlagsTable
      Environment:
        Variables:
          NODE_ENV: production
          DATA_BACKEND: dynamo
          PORT: "3000"
          API_GATEWAY_STAGE: !Ref Stage
          TABLE_CLINICS: !Ref ClinicsTable
          TABLE_USERS: !Ref UsersTable
          TABLE_AUTH_SESSIONS: !Ref AuthSessionsTable
          TABLE_SHADOWING_REQUESTS: !Ref ShadowingRequestsTable
          TABLE_EXPERIENCES: !Ref ExperiencesTable
          TABLE_PROJECTS: !Ref ProjectsTable
          TABLE_PLACEMENT_SESSIONS: !Ref PlacementSessionsTable
          TABLE_AUDIT_LOGS: !Ref AuditLogsTable
          TABLE_QUALITY_FLAGS: !Ref QualityFlagsTable
          ADMIN_EMAILS: !Ref AdminEmails
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the HTTP API
    Value: !GetAtt HttpApi.ApiEndpoint
  TableClinics:
    Value: !Ref ClinicsTable
  TableUsers:
    Value: !Ref UsersTable
  TableAuthSessions:
    Value: !Ref AuthSessionsTable
  TableShadowingRequests:
    Value: !Ref ShadowingRequestsTable
  TableExperiences:
    Value: !Ref ExperiencesTable
  TableProjects:
    Value: !Ref ProjectsTable
  TablePlacementSessions:
    Value: !Ref PlacementSessionsTable
  TableAuditLogs:
    Value: !Ref AuditLogsTable
  TableQualityFlags:
    Value: !Ref QualityFlagsTable
