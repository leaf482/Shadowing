AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Shadow Network API — HTTP API + Lambda + DynamoDB (pay-per-request)

Globals:
  Function:
    Timeout: 29
    MemorySize: !Ref LambdaMemoryMb
    Runtime: nodejs24.x
    Architectures:
      - arm64

Parameters:
  Stage:
    Type: String
    Default: dev
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated admin emails for ADMIN_EMAILS (optional).
  ResendApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Resend API key used for verification and password reset emails.
  FromEmail:
    Type: String
    Default: "Shadow Network <noreply@shadowingnetwork.com>"
    Description: Verified sender identity for auth emails.
  StaticBucketName:
    Type: String
    Default: "shadowing-static-dev-sitebucket-xnygmxwbe67z"
    Description: S3 bucket for public clinics.json snapshot (static CDN stack).
  CloudFrontDistributionId:
    Type: String
    Default: "E2XKSS6CLI091Q"
    Description: CloudFront distribution to invalidate /clinics.json after clinic mutations.
  LambdaMemoryMb:
    Type: Number
    Default: 256
    Description: Lambda memory (MB); lower = cheaper per ms — raise if cold starts OOM.
    MinValue: 128
    MaxValue: 3008
Resources:
  ClinicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AuthSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ShadowingRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ExperiencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlacementSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: project_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProjectIdIndex
          KeySchema:
            - AttributeName: project_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  QualityFlagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: lambda-handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShadowingRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExperiencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlacementSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QualityFlagsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${StaticBucketName}/clinics.json"
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
      Environment:
        Variables:
          NODE_ENV: production
          DATA_BACKEND: dynamo
          PORT: "3000"
          API_GATEWAY_STAGE: !Ref Stage
          TABLE_CLINICS: !Ref ClinicsTable
          TABLE_USERS: !Ref UsersTable
          TABLE_AUTH_SESSIONS: !Ref AuthSessionsTable
          TABLE_SHADOWING_REQUESTS: !Ref ShadowingRequestsTable
          TABLE_EXPERIENCES: !Ref ExperiencesTable
          TABLE_PROJECTS: !Ref ProjectsTable
          TABLE_PLACEMENT_SESSIONS: !Ref PlacementSessionsTable
          TABLE_AUDIT_LOGS: !Ref AuditLogsTable
          TABLE_QUALITY_FLAGS: !Ref QualityFlagsTable
          TABLE_RATE_LIMITS: !Ref RateLimitsTable
          ADMIN_EMAILS: !Ref AdminEmails
          RESEND_API_KEY: !Ref ResendApiKey
          FROM_EMAIL: !Ref FromEmail
          STATIC_BUCKET: !Ref StaticBucketName
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the HTTP API
    Value: !GetAtt HttpApi.ApiEndpoint
  TableClinics:
    Value: !Ref ClinicsTable
  TableUsers:
    Value: !Ref UsersTable
  TableAuthSessions:
    Value: !Ref AuthSessionsTable
  TableShadowingRequests:
    Value: !Ref ShadowingRequestsTable
  TableExperiences:
    Value: !Ref ExperiencesTable
  TableProjects:
    Value: !Ref ProjectsTable
  TablePlacementSessions:
    Value: !Ref PlacementSessionsTable
  TableAuditLogs:
    Value: !Ref AuditLogsTable
  TableQualityFlags:
    Value: !Ref QualityFlagsTable
  TableRateLimits:
    Value: !Ref RateLimitsTable
