AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Shadow Network API — HTTP API + Lambda + DynamoDB (pay-per-request)

Globals:
  Function:
    Timeout: 29
    MemorySize: !Ref LambdaMemoryMb
    Runtime: nodejs24.x
    Architectures:
      - arm64

Parameters:
  Stage:
    Type: String
    Default: dev
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated admin emails for ADMIN_EMAILS (optional).
  StaticBucketName:
    Type: String
    Default: "shadowing-static-dev-sitebucket-xnygmxwbe67z"
    Description: S3 bucket for public clinics.json snapshot (static CDN stack).
  CloudFrontDistributionId:
    Type: String
    Default: "E2XKSS6CLI091Q"
    Description: CloudFront distribution to invalidate /clinics.json after clinic mutations.
  LambdaMemoryMb:
    Type: Number
    Default: 256
    Description: Lambda memory (MB); lower = cheaper per ms — raise if cold starts OOM.
    MinValue: 128
    MaxValue: 3008
  SesDomain:
    Type: String
    Default: shadowingnetwork.com
    Description: Domain verified in Amazon SES for Cognito auth emails.
  SesFromAddress:
    Type: String
    Default: "Shadow Network <noreply@shadowingnetwork.com>"
    Description: From header for Cognito verification and password reset emails.
  Route53HostedZoneId:
    Type: String
    Default: Z055081139LW49BAPTZGK
    Description: Route 53 hosted zone for SesDomain (DKIM + MAIL FROM records).
  GoogleClientId:
    Type: String
    Default: "323836536700-3oo4vsourp842uaoigppq3r4himavbsm.apps.googleusercontent.com"
    Description: Google OAuth client ID for Cognito federated sign-in.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google OAuth client secret (required to enable Sign in with Google).
  CognitoDomainPrefix:
    Type: String
    Default: shadowing-network
    Description: Cognito hosted UI / OAuth domain prefix ({prefix}.auth.{region}.amazoncognito.com).

Conditions:
  HasGoogleOAuth: !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  ClinicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AuthSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ShadowingRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ExperiencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlacementSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: project_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProjectIdIndex
          KeySchema:
            - AttributeName: project_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  QualityFlagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CognitoPreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cognito-triggers/
      Handler: preSignUp.handler
      Runtime: nodejs24.x
      MemorySize: 128
      Timeout: 10

  CognitoPreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  SesEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesDomain
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub "mail.${SesDomain}"
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !GetAtt SesEmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: 1800
      ResourceRecords:
        - !GetAtt SesEmailIdentity.DkimDNSTokenValue3

  SesMailFromMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Sub "mail.${SesDomain}."
      Type: MX
      TTL: 3600
      ResourceRecords:
        - !Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"

  SesMailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Sub "mail.${SesDomain}."
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - SesEmailIdentity
    Properties:
      UserPoolName: !Sub "shadowing-users-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt CognitoPreSignUpFunction.Arn
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomain}"
        From: !Ref SesFromAddress
        ReplyToEmailAddress: noreply@shadowingnetwork.com
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: domain
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasGoogleOAuth
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleOAuth
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        name: name
        username: sub
        custom:domain: hd

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: !If
      - HasGoogleOAuth
      - - UserPool
        - GoogleIdentityProvider
      - - UserPool
    Properties:
      ClientName: !Sub "shadowing-spa-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: !If
        - HasGoogleOAuth
        - - COGNITO
          - Google
        - - COGNITO
      AllowedOAuthFlowsUserPoolClient: !If [HasGoogleOAuth, true, false]
      AllowedOAuthFlows: !If
        - HasGoogleOAuth
        - - code
        - !Ref AWS::NoValue
      AllowedOAuthScopes: !If
        - HasGoogleOAuth
        - - openid
          - email
          - profile
        - !Ref AWS::NoValue
      CallbackURLs: !If
        - HasGoogleOAuth
        - - https://shadowingnetwork.com/
          - https://www.shadowingnetwork.com/
          - http://localhost:5173/
        - !Ref AWS::NoValue
      LogoutURLs: !If
        - HasGoogleOAuth
        - - https://shadowingnetwork.com/
          - https://www.shadowingnetwork.com/
          - http://localhost:5173/
        - !Ref AWS::NoValue

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: lambda-handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShadowingRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExperiencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlacementSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QualityFlagsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${StaticBucketName}/clinics.json"
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Environment:
        Variables:
          NODE_ENV: production
          DATA_BACKEND: dynamo
          PORT: "3000"
          API_GATEWAY_STAGE: !Ref Stage
          TABLE_CLINICS: !Ref ClinicsTable
          TABLE_USERS: !Ref UsersTable
          TABLE_AUTH_SESSIONS: !Ref AuthSessionsTable
          TABLE_SHADOWING_REQUESTS: !Ref ShadowingRequestsTable
          TABLE_EXPERIENCES: !Ref ExperiencesTable
          TABLE_PROJECTS: !Ref ProjectsTable
          TABLE_PLACEMENT_SESSIONS: !Ref PlacementSessionsTable
          TABLE_AUDIT_LOGS: !Ref AuditLogsTable
          TABLE_QUALITY_FLAGS: !Ref QualityFlagsTable
          TABLE_RATE_LIMITS: !Ref RateLimitsTable
          ADMIN_EMAILS: !Ref AdminEmails
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_OAUTH_DOMAIN: !If [HasGoogleOAuth, !Ref CognitoDomainPrefix, ""]
          COGNITO_GOOGLE_ENABLED: !If [HasGoogleOAuth, "true", "false"]
          STATIC_BUCKET: !Ref StaticBucketName
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the HTTP API
    Value: !GetAtt HttpApi.ApiEndpoint
  TableClinics:
    Value: !Ref ClinicsTable
  TableUsers:
    Value: !Ref UsersTable
  TableAuthSessions:
    Value: !Ref AuthSessionsTable
  TableShadowingRequests:
    Value: !Ref ShadowingRequestsTable
  TableExperiences:
    Value: !Ref ExperiencesTable
  TableProjects:
    Value: !Ref ProjectsTable
  TablePlacementSessions:
    Value: !Ref PlacementSessionsTable
  TableAuditLogs:
    Value: !Ref AuditLogsTable
  TableQualityFlags:
    Value: !Ref QualityFlagsTable
  TableRateLimits:
    Value: !Ref RateLimitsTable
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoOAuthDomain:
    Condition: HasGoogleOAuth
    Description: Cognito hosted UI domain prefix for OAuth (full host is {prefix}.auth.{region}.amazoncognito.com)
    Value: !Ref CognitoDomainPrefix
  SesDomainIdentityArn:
    Value: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomain}"
